name = "scope-scanner-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# HELIUS_API_KEY is a secret, never a var:
#   npx wrangler secret put HELIUS_API_KEY
# Locally it lives in backend/.dev.vars (git-ignored).

# Holds two things under separate key prefixes:
#   analyze:*  per-token responses, TTL from config.ts (CACHE.ttlSeconds)
#   launch:*   launch facts, stored permanently — see chains/types.ts
#
# `wrangler dev` ignores the id and keeps this in .wrangler/state locally, so
# the binding works out of the box. Before deploying, create a real namespace
# and paste its id here:
#   npx wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "local-dev-placeholder"

# Per-IP rate limiting. This endpoint fronts our Helius key, so an unlimited
# public URL is an unlimited bill. 30 requests a minute is far more than a
# person clicking through tokens needs, and repeat views are served from cache
# without reaching the limiter at all.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
